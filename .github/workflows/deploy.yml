name: Deploy Palestra App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v6

      - name: Configura Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          

      - name: Installa dipendenze
        run: npm install

      - name: Costruisci l'app
        run: npm run build

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara l'app
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Pubblica l'app
        id: deployment
        uses: actions/deploy-pages@v4
